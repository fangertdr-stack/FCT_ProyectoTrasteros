<div class="rent-container">

  <div class="rent-card">
    <h2>Contratar Trastero</h2>

    <button class="back-btn" (click)="goBack()">
      ←
    </button>

    <form>

      <div class="form-group">
        <label>Nombre Completo</label>
        <input type="text" placeholder="Nombre" [(ngModel)]="nombre" name="nombre">
      </div>



      <div class="form-group">
        <label>DNI</label>
        <input type="text" placeholder="DNI/NIE" [(ngModel)]="dni" name="dni">
      </div>

      <div class="form-group">
        <label>Dirección</label>
        <input type="text" placeholder="Calle, número..." [(ngModel)]="direccion" name="direccion">
      </div>

      <div class="form-group">
        <label>Teléfono</label>
        <input type="tel" placeholder="Teléfono" [(ngModel)]="telefono" name="telefono">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="Correo electrónico" [(ngModel)]="email" name="email">
      </div>

      <mat-form-field appearance="outline">
        <mat-label>Duración del alquiler</mat-label>

        <mat-select [(value)]="duracionSeleccionada">

          <mat-option value="1">
            1 mes
          </mat-option>

          <mat-option value="3">
            3 meses
          </mat-option>

          <mat-option value="6">
            6 meses
          </mat-option>

        </mat-select>

      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Elección de trastero</mat-label>

        <mat-select [(value)]="tamanioSeleccionado">

          <mat-option value="pequeño">
            Pequeño
          </mat-option>

          <mat-option value="mediano">
            Mediano
          </mat-option>

          <mat-option value="grande">
            Grande
          </mat-option>

        </mat-select>

      </mat-form-field>
      <br>



      <button type="button" class="rent-btn" (click)="pagar()">Continuar y Pagar</button>


    </form>
    <mat-checkbox [(ngModel)]="aceptaNormas">He leído y acepto el
      <a href="/contrato.html" target="_blank" (click)="contratoAbierto = true">
        Contrato
      </a>
    </mat-checkbox>

  </div>

</div>


<!-- Modal de código de pago -->
<div *ngIf="codigoGeneradoVisible" class="modal-overlay" (click)="cerrarCodigo()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <h3>Código creado</h3>
    <p>Tu trastero asignado es: <strong>{{ trasteroAsignado }}</strong></p>

    <p>Tu código de acceso a su trastero es: <strong>{{ codigoPago }}</strong></p>
    <div class="modal-buttons">
      <button type="button" (click)="cerrarCodigo()">Cerrar</button>
    </div>
  </div>
</div>
